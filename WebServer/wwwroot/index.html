<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="description" content="Internal corporate personnel management portal for Paranoia Corp. Social deduction intranet." />

  <!-- Mid-century Corporate Dossier Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23121920'/><circle cx='16' cy='16' r='11' fill='none' stroke='%23d9483b' stroke-width='2'/><path d='M10 16h12M16 10v12' stroke='%23f4f0e6' stroke-width='2'/></svg>" />

  <!-- Google Fonts: Barlow Condensed & IBM Plex Sans & IBM Plex Mono with full Cyrillic support -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap&subset=latin,cyrillic" rel="stylesheet">

  <link rel="stylesheet" href="/css/app.css" />

<body>

  <div id="app">
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#121920; color:#f4f0e6; font-family:'IBM Plex Mono', monospace; text-transform:uppercase; letter-spacing:2px; font-size:12px;">

    </div>
  </div>

  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <!-- SignalR Client Library from CDN with fallback -->
