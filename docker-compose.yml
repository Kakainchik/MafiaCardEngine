services:
  paranoiacorp-server:
    build:
      context: .
      dockerfile: WebServer/Dockerfile
    container_name: paranoiacorp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - JWT_KEY=ParanoiaCorpProductionInternalSecretKey_ReplaceInProduction!
      # SQLite database stored on persistent volume:
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/paranoiacorp.db
    volumes:
      - paranoia_db_data:/app/data

  # Optional turnkey reverse proxy with automatic HTTPS / Let's Encrypt certificates:
  # Enable by running: docker compose --profile proxy up -d
  # Or configure Nginx/Caddy manually as described in README.md
  caddy:
    image: caddy:2-alpine
    container_name: paranoiacorp-caddy
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - paranoiacorp-server

volumes:
  paranoia_db_data:
  caddy_data:
  caddy_config:
